name: Claude Code Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # Without the secret the action falls back to OIDC, which this job is not
    # set up for, and fails every PR. Skip it until the secret is added.
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Skip when ANTHROPIC_API_KEY is not set
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY secret is not set, so the Claude review is skipped."

      - name: Checkout repository
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            ${{ github.event_name == 'pull_request' && 'Review this pull request. Check for code quality, bugs, security, and performance. Be constructive.' || '' }}
            ${{ github.event_name == 'issues' && 'Analyze this issue. Provide an assessment, suggest an approach, and ask clarifying questions if needed.' || '' }}
          claude_args: '--max-turns 10'
